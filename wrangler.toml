name = "d2trade"
pages_build_output_dir = "public"
compatibility_date = "2025-08-12"
compatibility_flags = ["nodejs_compat"]

# 环境变量（敏感信息请用 wrangler secret put / Pages 密钥）
[vars]
ENVIRONMENT = "production"

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "d2trade-db"
database_id = "da14f123-d4c9-4849-85b4-aebd6328c849"

# KV 命名空间（需要时取消注释）
# [[kv_namespaces]]
# binding = "MY_KV"
# id = "your-kv-id"

# R2 存储桶（需要时取消注释）
# [[r2_buckets]]
# binding = "MY_BUCKET"
# bucket_name = "d2trade-bucket"

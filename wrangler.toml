name = "d2trade"
main = "src/index.ts"
compatibility_date = "2025-08-12"
compatibility_flags = ["nodejs_compat"]

# Workers 配置
[observability]
enabled = true

# 环境变量（敏感信息请用 wrangler secret put）
[vars]
ENVIRONMENT = "development"

# 开发环境
[env.dev]
name = "d2trade-dev"

# 生产环境
[env.production]
name = "d2trade-prod"

# KV 命名空间（需要时取消注释）
# [[kv_namespaces]]
# binding = "MY_KV"
# id = "your-kv-id"

# D1 数据库（需要时取消注释）
# [[d1_databases]]
# binding = "DB"
# database_name = "d2trade-db"
# database_id = "your-db-id"

# R2 存储桶（需要时取消注释）
# [[r2_buckets]]
# binding = "MY_BUCKET"
# bucket_name = "d2trade-bucket"

# Pages 配置（用于 Cloudflare Pages + Functions）
[pages]
build_dir = "public"
compatibility_date = "2025-08-12"
